[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pictify"
version = "1.0.0"
description = "Official Python SDK for Pictify - Generate images from HTML templates"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Pictify", email = "support@pictify.io" }
]
keywords = [
    "pictify",
    "image-generation",
    "html-to-image",
    "og-image",
    "social-cards",
    "api",
    "sdk"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed"
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
async = [
    "aiofiles>=23.0.0"
]
pandas = [
    "pandas>=1.5.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0"
]
all = [
    "pictify[async,pandas,dev]"
]

[project.urls]
Homepage = "https://pictify.io"
Documentation = "https://docs.pictify.io/sdks/python"
Repository = "https://github.com/pictify-io/pictify-python"
Issues = "https://github.com/pictify-io/pictify-python/issues"

[tool.hatch.build.targets.sdist]
include = [
    "/pictify",
    "/tests",
    "/README.md",
    "/LICENSE"
]

[tool.hatch.build.targets.wheel]
packages = ["pictify"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.mypy]
python_version = "3.8"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
